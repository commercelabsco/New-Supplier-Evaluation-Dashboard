<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Supplier Evaluation Dashboard</title>
<style>
  :root{
    --ink:#1C2B39;
    --ink-soft:#55606B;
    --bg:#F3F5F7;
    --panel:#FFFFFF;
    --border:#DFE3E7;
    --accent:#2F6690;
    --accent-soft:#EAF1F6;
    --gold:#96700C;
    --gold-soft:#FBF1DD;
    --green:#3F7A4E;
    --green-soft:#EAF4EC;
    --red:#A83232;
    --red-soft:#FBEAEA;
    --mono: "SFMono-Regular", Consolas, Menlo, monospace;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);}
  .shell{display:flex;min-height:100vh;}
  nav.side{
    width:220px;flex-shrink:0;background:var(--ink);color:#DCE4EA;
    padding:28px 0;position:sticky;top:0;height:100vh;
  }
  nav.side .brand{
    font-family:var(--serif);font-size:19px;line-height:1.3;
    padding:0 22px 24px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:18px;
  }
  nav.side .brand small{display:block;font-family:var(--sans);font-size:11px;color:#8FA2AF;margin-top:4px;}
  nav.side button{
    display:block;width:100%;text-align:left;background:none;border:none;color:#B9C6CE;
    font-size:14px;padding:11px 22px;cursor:pointer;border-left:3px solid transparent;
  }
  nav.side button:hover{color:#fff;background:rgba(255,255,255,.05);}
  nav.side button.active{color:#fff;background:rgba(255,255,255,.08);border-left-color:var(--accent);font-weight:600;}
  main{flex:1;padding:36px 44px;max-width:1100px;}
  h1{font-family:var(--serif);font-size:26px;margin:0 0 6px;}
  .sub{color:var(--ink-soft);font-size:14px;margin:0 0 28px;max-width:640px;line-height:1.5;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:24px 26px;margin-bottom:22px;}
  .panel h2{font-size:15px;text-transform:none;margin:0 0 4px;font-weight:700;}
  .panel .weight-tag{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
  label.field{display:block;font-size:13px;font-weight:600;margin:14px 0 5px;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:4px;
    font-size:14px;font-family:var(--sans);background:#fff;color:var(--ink);
  }
  select{cursor:pointer;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .btn{
    background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:5px;
    font-size:14px;font-weight:600;cursor:pointer;
  }
  .btn:hover{background:#25516F;}
  .btn.secondary{background:none;border:1px solid var(--border);color:var(--ink);}
  .btn.secondary:hover{background:var(--bg);}
  .btn.danger{background:none;color:var(--red);border:1px solid var(--red-soft);}
  .btn.danger:hover{background:var(--red-soft);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .actions-row{display:flex;gap:10px;margin-top:22px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;color:var(--ink-soft);font-weight:600;
     border-bottom:1px solid var(--border);padding:8px 10px;white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  tr:hover td{background:#FAFBFC;}
  .num{font-family:var(--mono);}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;}
  .badge.excellent,.badge.good{background:var(--green-soft);color:var(--green);}
  .badge.acceptable{background:var(--gold-soft);color:var(--gold);}
  .badge.risk,.badge.poor{background:var(--red-soft);color:var(--red);}
  .badge.gate{background:var(--red);color:#fff;}
  .flag-partial{color:var(--gold);font-weight:600;}
  .flag-full{color:var(--green-soft);}
  .empty{color:var(--ink-soft);font-size:14px;padding:20px 0;}
  .section-title{font-family:var(--serif);font-size:18px;margin:30px 0 4px;}
  .compare-grid{display:grid;grid-template-columns:180px repeat(auto-fit,minmax(180px,1fr));gap:0;}
  .compare-grid .rowlabel{font-size:12px;color:var(--ink-soft);padding:9px 10px;border-bottom:1px solid var(--border);font-weight:600;}
  .compare-grid .cell{font-size:13.5px;padding:9px 10px;border-bottom:1px solid var(--border);}
  .compare-grid .colhead{font-family:var(--serif);font-size:15px;padding:9px 10px;border-bottom:2px solid var(--ink);}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;margin:8px 0;}
  .savebar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--border);
           padding:14px 26px;margin:0 -26px -24px;border-radius:0 0 6px 6px;}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 18px;
         border-radius:6px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;
         transition:opacity .25s;pointer-events:none;}
  .toast.show{opacity:1;}
  .completeness{font-size:12px;color:var(--ink-soft);margin-top:2px;}
</style>
</head>
<body>
<div class="shell">
  <nav class="side">
    <div class="brand">Weng<small>Procurement 70% + QC 30%</small></div>
    <button data-view="new" class="active">+ New Evaluation</button>
    <button data-view="ongoing">Ongoing</button>
    <button data-view="history">History</button>
    <button data-view="byproduct">By Product</button>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   SCORING MODEL
   ============================================================ */
const QC_WEIGHTS = { testingCapacity:2, gmpMatch:6, responsivenessResolution:6, productQuality:5, coaTurnaround:5, labelReviewer:6 };
const QC_TOTAL = 30;

const PROC_BASE = { productCost:20, paymentTerms:20, moq:20, leadTime:10 }; // sums to 70 exactly, no rescale needed when all 4 answered
const PROC_RESCALE = 70 / Object.values(PROC_BASE).reduce((a,b)=>a+b,0); // self-correcting: PROC_BASE sums to 70 now, so this is 1
const PROC_WEIGHTS = Object.fromEntries(Object.entries(PROC_BASE).map(([k,v])=>[k, v*PROC_RESCALE]));
const PROC_TOTAL = 70;

const OPTS = {
  fiveBandDesc: (labels) => labels.map((l,i)=>({label:l, score:5-i})), // first label = best = 5

  testingCapacity: [
    "Full in-house testing (heavy metals, micro, assay) + ISO 17025 accredited, AND stability + certification-specific testing offered",
    "In-house testing for most panels; third-party (ISO 17025 accredited) covers the rest",
    "Fully third-party tested, ISO 17025 accredited",
    "Third-party tested, accreditation unclear or not ISO 17025",
    "No consistent testing arrangement in place"
  ],
  gmpMatch: [
    "Current GMP cert, scope matches exactly, no open FDA 483s",
    "Current GMP cert, scope broadly covers product type, no open FDA 483s",
    "Current GMP cert, minor scope gap, no open FDA 483s",
    "GMP cert expiring \u226490 days, and/or scope mismatch, and/or resolved 483 in past 12 months",
    "No valid GMP certificate, or an open/unresolved FDA 483 \u2014 HARD GATE"
  ],
  responsivenessResolution: ["10 business days or fewer","11\u201320 business days","21\u201330 business days","31\u201345 business days","More than 45 business days / often unresolved"],
  productQuality: [
    "Zero quality issues in the period",
    "One minor (advisory-level) finding, resolved",
    "One moderate finding, or two+ minor findings",
    "One major finding, or recurring moderate findings",
    "Multiple major findings, unresolved/recurring major finding, or a recall"
  ],
  coaTurnaround: ["5 business days or fewer (grace period)","6\u201310 business days","11\u201315 business days","16\u201320 business days","More than 20 business days"],
  labelReviewer: [
    "Dedicated in-house regulatory/label reviewer signs off on every label prior to production; documented process",
    "Qualified staff perform regulatory label review prior to production (not a dedicated role), documented",
    "Label review performed but informal / inconsistently documented",
    "Label review only when customer specifically requests it, not routine",
    "No label review process \u2014 relies entirely on customer-provided artwork, no internal check"
  ],
  moq: ["Under 1,000 units","1,000\u20132,499 units","2,500\u20134,999 units","5,000\u20139,999 units","10,000+ units"],
  leadTime: ["15 business days or fewer","16\u201330 business days","31\u201345 business days","46\u201360 business days","More than 60 business days"],
  netTerms: ["Net 60 or longer","Net 45","Net 30","Net 15","Due on delivery / prepayment required"],
  deposit: ["No deposit required","1\u201325% deposit","26\u201350% deposit","51\u201375% deposit","76\u2013100% deposit"],
  credit: ["Over $100,000","$50,000\u2013$100,000","$10,000\u2013$49,999","Under $10,000","No credit extended"],
};

function bandScore(list, idx){ if(idx===""||idx===null||idx===undefined) return null; const n=list.length; return n-Number(idx); }

// ---- Criterion field definitions used to render forms + compute scores ----
const QC_FIELDS = [
  {key:"testingCapacity", label:"Testing Capacity", weightKey:"testingCapacity", options:OPTS.testingCapacity},
  {key:"gmpMatch", label:"GMP Certification & Regulatory Compliance", weightKey:"gmpMatch", options:OPTS.gmpMatch, hardGateAt:5},
  {key:"responsivenessResolution", label:"Responsiveness & Issue Resolution (queries, document requests \u2014 e.g. GMP cert, SDS \u2014 and non-quality issues)", weightKey:"responsivenessResolution", options:OPTS.responsivenessResolution},
  {key:"productQuality", label:"Product Quality History (12 mo)", weightKey:"productQuality", options:OPTS.productQuality},
  {key:"coaTurnaround", label:"COA Turnaround", weightKey:"coaTurnaround", options:OPTS.coaTurnaround},
  {key:"labelReviewer", label:"Label Reviewer / Regulatory Label Review", weightKey:"labelReviewer", options:OPTS.labelReviewer},
];

// Onboarding-assessable (audit/documentation-based, answerable before any
// order history) vs Performance (requires an actual track record with the
// supplier). Used to compute the two automatic sub-scores below.
const ONBOARDING_QC_KEYS = ["testingCapacity","gmpMatch","labelReviewer"];
const PERFORMANCE_QC_KEYS = ["responsivenessResolution","productQuality","coaTurnaround"];

/* ============================================================
   STORAGE
   Data is persisted in a Google Sheet via a small Apps Script Web App
   bound to that sheet (see google-apps-script/Code.gs) so every user,
   from any device/location, reads and writes the same shared data.
   This MUST be deployed with "Who has access: Anyone" (the plain,
   non-domain-restricted option). A domain-restricted deployment
   (.../a/macros/<domain>/s/.../exec) doesn't just require sign-in \u2014
   fetch() calls to it get blocked by CORS entirely (the browser can't
   read the response at all, regardless of who's signed in), because
   the access-check redirect it goes through doesn't send CORS headers.
   Only the public "Anyone" deployment (.../macros/s/.../exec, no
   /a/macros/<domain>/ in the URL) works with the fetch() calls below.
   See google-apps-script/README.md for deploy steps.
   If the URL is unset/unreachable, we fall back to an in-memory store
   for the current session only and rely on Export/Import to carry
   data across sessions instead.
   ============================================================ */
const SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwgViCVWtG2mUUPPnsXxLNoKx5vkuLyUqlwlWC_RZkRmxT9N70pBZlW4jZqRY1SN0St9w/exec";
let storageMode = "unknown"; // "sheet" | "memory"
let memoryDB = {};

async function parseSheetResponse_(res){
  if(!res.ok) throw new Error("HTTP "+res.status);
  const text = await res.text();
  try{ return JSON.parse(text); }
  catch(e){
    // Apps Script returns an HTML login/redirect page (not JSON) when the
    // deployment is restricted to a Workspace domain and the visitor isn't
    // logged into that domain in this browser \u2014 the #1 cause of "works for
    // me, not for my coworker". Surface that clearly instead of a vague
    // JSON-parse error.
    if(/<html/i.test(text)){
      throw new Error("Sheet returned a login page, not data \u2014 the Apps Script deployment is probably restricted to a Google Workspace domain. Redeploy with \"Who has access: Anyone\".");
    }
    throw new Error("Sheet returned an unexpected response: "+text.slice(0,120));
  }
}
async function postToSheet_(payload){
  const res = await fetch(SHEET_WEBAPP_URL, { method:"POST", body: JSON.stringify(payload) });
  return parseSheetResponse_(res);
}
async function getFromSheet_(type){
  const res = await fetch(SHEET_WEBAPP_URL+"?type="+type);
  return parseSheetResponse_(res);
}

async function probeStorage(){
  try{
    if(!SHEET_WEBAPP_URL || SHEET_WEBAPP_URL.indexOf("PASTE_")===0) throw new Error("SHEET_WEBAPP_URL not configured");
    await getFromSheet_("evaluations");
    storageMode = "sheet";
  }catch(e){
    console.warn("Google Sheet sync unavailable, using in-memory fallback:", e);
    storageMode = "memory";
  }
}

async function listEvaluations(){
  if(storageMode==="memory"){
    return Object.values(memoryDB).sort((a,b)=> (b.computed?.totalScore ?? -1) - (a.computed?.totalScore ?? -1));
  }
  try{
    const out = await getFromSheet_("evaluations");
    out.sort((a,b)=> (b.computed?.totalScore ?? -1) - (a.computed?.totalScore ?? -1));
    return out;
  }catch(e){
    console.error("listEvaluations failed:", e);
    showToast("Couldn't load from the Sheet: "+e.message);
    return Object.values(memoryDB);
  }
}
async function saveEvaluation(record){
  if(storageMode==="memory"){ memoryDB[record.id]=record; return; }
  try{
    await postToSheet_({action:"save", type:"evaluation", record});
  }catch(e){
    console.error("saveEvaluation failed:", e);
    memoryDB[record.id]=record; // don't lose the entry even if the Sheet save failed
    showToast("Sheet save failed (\""+e.message+"\") \u2014 kept for this session only. Use Export to back it up.");
    throw e;
  }
}
async function deleteEvaluation(id){
  delete memoryDB[id];
  if(storageMode==="memory") return;
  try{ await postToSheet_({action:"delete", type:"evaluation", id}); }
  catch(e){ console.error("deleteEvaluation failed:", e); }
}

/* ---- Saved comparisons: a persisted record every time "Save Comparison"
   is clicked, so it shows up in History \u2014 not just as a download.
   Each save creates a NEW snapshot (never overwrites a prior one), so
   adding a 3rd supplier later and saving again keeps both the 2-supplier
   and 3-supplier comparisons on record. ---- */
let memoryComparisons = {};
async function listComparisons(){
  if(storageMode==="memory"){
    return Object.values(memoryComparisons).sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
  }
  try{
    const out = await getFromSheet_("comparisons");
    out.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
    return out;
  }catch(e){
    console.error("listComparisons failed:", e);
    return Object.values(memoryComparisons);
  }
}
async function saveComparisonRecord(productLabel, suppliers){
  const best = pickBestSupplier(suppliers);
  const record = {
    id: Date.now()+"-"+Math.random().toString(36).slice(2,8),
    product: productLabel,
    savedAt: Date.now(),
    bestSupplier: best ? best.supplier : null,
    bestScore: best ? best.computed.totalScore : null,
    suppliers: suppliers.map(e=>({
      supplier: e.supplier, status: e.status, totalScore: e.computed.totalScore,
      rating: e.computed.rating, hardGate: e.computed.hardGate,
      qcTotal: e.computed.qcTotal, procTotal: e.computed.procTotal,
      onboardingScore: e.computed.onboardingScore, performanceScore: e.computed.performanceScore,
    })),
  };
  if(storageMode==="memory"){ memoryComparisons[record.id]=record; return record; }
  try{ await postToSheet_({action:"save", type:"comparison", record}); }
  catch(e){
    console.error("saveComparisonRecord failed:", e);
    memoryComparisons[record.id]=record;
    showToast("Comparison saved for this session only \u2014 Sheet save failed.");
  }
  return record;
}
async function deleteComparison(id){
  delete memoryComparisons[id];
  if(storageMode==="memory") return;
  try{ await postToSheet_({action:"delete", type:"comparison", id}); }
  catch(e){ console.error("deleteComparison failed:", e); }
}
function exportAll(evals){
  const blob = new Blob([JSON.stringify(evals, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "supplier-evaluations-export.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function importAll(file){
  const text = await file.text();
  let records;
  try{ records = JSON.parse(text); }
  catch(e){ showToast("That file isn't valid JSON."); return; }
  if(!Array.isArray(records)){ showToast("Expected a JSON array of evaluations."); return; }
  let count=0;
  for(const r of records){
    if(!r.id || !r.supplier) continue;
    try{ await saveEvaluation(r); count++; } catch(e){ /* already logged/toasted */ }
  }
  showToast(`Imported ${count} evaluation${count===1?"":"s"}.`);
}
function exportOne(record){
  const blob = new Blob([JSON.stringify(record, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safeName = (record.supplier+"_"+(record.product||"evaluation")).replace(/[^\w.-]+/g,"_");
  a.href = url; a.download = safeName+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportComparisonRecord(record){
  const blob = new Blob([JSON.stringify(record, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safeName = ("Comparison_"+record.product).replace(/[^\w.-]+/g,"_");
  a.href = url; a.download = safeName+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function startNewForProduct(productLabel){
  editingRecord = { supplier:"", product: productLabel, notes:"", proc:{}, qc:{} };
  currentView="new"; setActiveNav(); render();
}

/* ============================================================
   Full-detail breakdown (every question + the answer given)
   ============================================================ */
function labelFor(list, idx){
  if(idx===""||idx===null||idx===undefined) return "Not answered";
  const v = list[Number(idx)];
  return v===undefined ? "Not answered" : v;
}
// Plain-text version of every answer, one key per Sheet column, so the
// Google Sheet reads as a normal spreadsheet (one question = one column)
// instead of everything buried inside the "data" JSON blob.
function readableAnswers(form){
  const p = form.proc||{}, q = form.qc||{};
  const out = { productCost: p.actualCost ? `$${p.actualCost}/unit` : "" };
  out.netTerms = labelFor(OPTS.netTerms, p.netTerms);
  out.deposit = labelFor(OPTS.deposit, p.deposit);
  out.credit = labelFor(OPTS.credit, p.credit);
  out.moq = labelFor(OPTS.moq, p.moq);
  out.leadTime = labelFor(OPTS.leadTime, p.leadTime);
  QC_FIELDS.forEach(f => out[f.key] = labelFor(f.options, q[f.key]));
  return out;
}
function detailRow(label, val){
  return `<div class="rowlabel" style="font-weight:400;">${escapeHtml(label)}</div><div class="cell">${escapeHtml(val)}</div>`;
}
function renderDetailBreakdown(e){
  const p = e.proc||{}, q = e.qc||{};
  const costText = p.actualCost ? `$${p.actualCost}/unit` : "Not answered";
  const procRows = [
    detailRow("Product Cost (Turnkey)", costText),
    detailRow("Payment Terms \u2014 Net terms", labelFor(OPTS.netTerms, p.netTerms)),
    detailRow("Payment Terms \u2014 Deposit", labelFor(OPTS.deposit, p.deposit)),
    detailRow("Payment Terms \u2014 Credit limit", labelFor(OPTS.credit, p.credit)),
    detailRow("MOQ", labelFor(OPTS.moq, p.moq)),
    detailRow("Lead Time", labelFor(OPTS.leadTime, p.leadTime)),
  ].join("");
  const qcRows = QC_FIELDS.map(f=>detailRow(f.label, labelFor(f.options, q[f.key]))).join("");
  return `<div style="display:grid;grid-template-columns:240px 1fr;gap:0;font-size:13px;max-width:720px;">
    <div class="rowlabel" style="font-weight:700;">Procurement</div><div class="cell"></div>
    ${procRows}
    <div class="rowlabel" style="font-weight:700;margin-top:6px;">Quality</div><div class="cell"></div>
    ${qcRows}
    ${e.notes?`<div class="rowlabel" style="font-weight:700;">Notes</div><div class="cell">${escapeHtml(e.notes)}</div>`:""}
  </div>`;
}
function detailToggleButton(id){
  return `<button class="btn secondary" data-view-detail="${id}" style="padding:4px 10px;font-size:12px;">View</button>`;
}
function editButton(id){
  return `<button class="btn secondary" data-edit="${id}" style="padding:4px 10px;font-size:12px;">Edit</button>`;
}
function saveButton(id){
  return `<button class="btn secondary" data-export="${id}" style="padding:4px 10px;font-size:12px;">Save</button>`;
}
function detailRowMarkup(id, colspan, record){
  return `<tr class="detail-row" data-detail-for="${id}" style="display:none;"><td colspan="${colspan}" style="background:#FAFBFC;">${renderDetailBreakdown(record)}</td></tr>`;
}
function wireDetailAndExportButtons(recordLookup){
  document.querySelectorAll("[data-view-detail]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.getAttribute("data-view-detail");
      const row = document.querySelector(`[data-detail-for="${CSS.escape(id)}"]`);
      if(row) row.style.display = (row.style.display==="none"||!row.style.display) ? "table-row" : "none";
    });
  });
  document.querySelectorAll("[data-export]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const rec = recordLookup(btn.getAttribute("data-export"));
      if(rec) exportOne(rec); else showToast("Couldn't find that evaluation.");
    });
  });
}
function wireEditButtons(recordLookup){
  document.querySelectorAll("[data-edit]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const rec = recordLookup(btn.getAttribute("data-edit"));
      if(!rec){ showToast("Couldn't find that evaluation."); return; }
      editingRecord = rec;
      currentView="new"; setActiveNav(); render();
    });
  });
}

/* ============================================================
   COMPUTE SCORE
   ============================================================ */
function computeScores(form){
  // QC side
  let qcSum=0, qcWeightUsed=0, hardGate=false;
  const qcDetail={};
  for(const f of QC_FIELDS){
    const idx = form.qc[f.key];
    const score = bandScore(f.options, idx);
    const w = QC_WEIGHTS[f.weightKey];
    qcDetail[f.key]={score, weight:w};
    if(score!==null){
      qcWeightUsed += w;
      qcSum += (score/5)*w;
      if(f.hardGateAt && score===1) hardGate=true;
    }
  }
  const qcRescale = qcWeightUsed>0 ? QC_TOTAL/qcWeightUsed : 0;
  const qcTotal = qcSum*qcRescale;

  // Procurement side
  const p = form.proc;
  // Product Cost is reference-only now (shown/compared as a raw number, see
  // the "Cheapest" flag in the comparison grid) \u2014 it never contributes a
  // score. Always null here so the existing rescale-if-unanswered logic
  // spreads its 20% weight across Payment Terms, MOQ, and Lead Time.
  const productCostScore = null;
  const paymentScore = averageOf([bandScore(OPTS.netTerms,p.netTerms), bandScore(OPTS.deposit,p.deposit), bandScore(OPTS.credit,p.credit)]);
  const moqScore = bandScore(OPTS.moq, p.moq);
  const leadTimeScore = bandScore(OPTS.leadTime, p.leadTime);

  const procDetail = {
    productCost:{score:productCostScore, weight:PROC_WEIGHTS.productCost},
    paymentTerms:{score:paymentScore, weight:PROC_WEIGHTS.paymentTerms},
    moq:{score:moqScore, weight:PROC_WEIGHTS.moq},
    leadTime:{score:leadTimeScore, weight:PROC_WEIGHTS.leadTime},
  };
  let procSum=0, procWeightUsed=0;
  for(const k in procDetail){
    const d = procDetail[k];
    if(d.score!==null){ procWeightUsed += d.weight; procSum += (d.score/5)*d.weight; }
  }
  const procRescale = procWeightUsed>0 ? PROC_TOTAL/procWeightUsed : 0;
  const procTotal = procSum*procRescale;

  const totalScore = qcTotal+procTotal;
  const completenessQC = qcWeightUsed/QC_TOTAL;
  const completenessProc = procWeightUsed/PROC_TOTAL;

  // Onboarding vs Performance split: some QC criteria can be assessed before
  // any order history exists (audit/documentation-based); others genuinely
  // require a track record. Computed automatically for every evaluation so
  // a brand-new supplier and an established one can be read on the basis
  // that's actually available for each, rather than forcing one blended
  // number that quietly rests on very different amounts of real data.
  function subsetScore(keys){
    let sum=0, weightUsed=0;
    for(const k of keys){
      const d = qcDetail[k];
      if(d && d.score!==null){ weightUsed += d.weight; sum += (d.score/5)*d.weight; }
    }
    if(weightUsed===0) return null;
    return (sum/weightUsed)*100;
  }
  const onboardingScore = subsetScore(ONBOARDING_QC_KEYS);
  const performanceScore = subsetScore(PERFORMANCE_QC_KEYS);

  let rating, recommendation;
  if(hardGate){ rating="NOT APPROVED"; recommendation="Hard gate \u2014 GMP disqualification"; }
  else if(completenessQC===0 && completenessProc===0){ rating="\u2014"; recommendation="No data entered"; }
  else if(totalScore>=90){ rating="Excellent"; recommendation="Strong candidate"; }
  else if(totalScore>=80){ rating="Good"; recommendation="Recommended"; }
  else if(totalScore>=70){ rating="Acceptable"; recommendation="Consider / monitor"; }
  else if(totalScore>=60){ rating="Risk"; recommendation="Needs improvement or negotiation"; }
  else { rating="Poor"; recommendation="Not recommended"; }

  return { qcTotal, procTotal, totalScore, hardGate, rating, recommendation,
           completenessQC, completenessProc, qcDetail, procDetail,
           onboardingScore, performanceScore };
}
function computeCostScore(target, actual){
  target=parseFloat(target); actual=parseFloat(actual);
  if(isNaN(target)||isNaN(actual)||target<=0) return null;
  const variance = (actual-target)/target;
  if(variance<=0) return 5;
  if(variance<=0.05) return 4;
  if(variance<=0.15) return 3;
  if(variance<=0.25) return 2;
  return 1;
}
function bandScore3(list, idx, n){ if(idx===""||idx===null||idx===undefined) return null; const len=n||3; if(len===2) return idx==0?5:1; return [5,3,1][Number(idx)]; }
function averageOf(arr){ const v=arr.filter(x=>x!==null&&x!==undefined); if(!v.length) return null; return v.reduce((a,b)=>a+b,0)/v.length; }

function fillFormFields(record){

function pickBestSupplier(suppliers){
  const eligible = suppliers.filter(e=>!e.computed.hardGate);
  if(!eligible.length) return null;
  return eligible.reduce((best,cur)=> cur.computed.totalScore>best.computed.totalScore ? cur : best, eligible[0]);
}
function renderCompareGrid(chosen){
  const best = pickBestSupplier(chosen);
  const banner = best
    ? `<div class="panel" style="background:var(--green-soft);border-color:var(--green);margin-bottom:12px;">
        <strong>Best Supplier: ${escapeHtml(best.supplier)}</strong> \u2014 Total Score ${best.computed.totalScore.toFixed(1)} / 100 (${best.computed.rating})
      </div>`
    : `<div class="panel" style="background:var(--red-soft);border-color:var(--red);margin-bottom:12px;">
        <strong>No qualifying supplier</strong> \u2014 every compared supplier is disqualified by the GMP hard gate.
      </div>`;
  const cols = chosen.map(e=>{
    const isBest = best && e.id===best.id;
    return `<div class="colhead" style="${isBest?"color:var(--green);":""}">${escapeHtml(e.supplier)}${isBest?" \u2605 Best":""}</div>`;
  }).join("");
  const bodyRows = COMPARE_ROWS.map(r=>{
    const cells = chosen.map(e=>`<div class="cell">${r.get(e, chosen)}</div>`).join("");
    return `<div class="rowlabel">${r.label}</div>${cells}`;
  }).join("");
  return banner + `<div class="compare-grid" style="grid-template-columns:180px repeat(${chosen.length},1fr);">
    <div></div>${cols}${bodyRows}
  </div>`;
}

    }
    return `<div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h2 style="margin:0;">${escapeHtml(g.label)}</h2>
        <button class="btn secondary" data-add-supplier="${idx}" style="padding:5px 12px;font-size:13px;">+ Add Supplier</button>
      </div>
      <table>
        <tr><th>Ref #</th><th>Supplier</th><th>Status</th><th>QC</th><th>Proc.</th><th>Total</th><th>Rating</th><th>Completeness</th><th></th></tr>
        ${rows}
      </table>
      ${compareBlock}
    </div>`;
  }).join("");
  return `
  <h1>By Product</h1>
  <p class="sub">Evaluations are grouped by product. Once two or more suppliers for the same product are submitted, a Compare button appears below that product's list. Use <strong>+ Add Supplier</strong> to evaluate another supplier against the same product.</p>
  ${banner}${exportImportBar()}
  ${sections}`;
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ============================================================
   APP SHELL / ROUTING
   ============================================================ */
let currentView="new";
let currentDraftId=null;
let currentDraftStatus=null;
let currentDraftRefNumber=null;
let autoSaveTimer=null;
let editingRecord=null;
let lastOngoingList=[];
let lastComparisonList=[];
let lastByProductList=[];
let groupLabelsByIdx={};
let compareGroupsByIdx={};
let memoryRefCounter=0;

async function getNextRefNumber(){
  if(storageMode==="memory"){
    memoryRefCounter += 1;
    return memoryRefCounter;
  }
  try{
    const res = await postToSheet_({action:"nextRef"});
    return res.next;
  }catch(e){
    memoryRefCounter += 1;
    return memoryRefCounter;
  }
}
function formatRefNumber(n){
  return n ? "EVAL-"+String(n).padStart(3,"0") : "\u2014";
}
// Resolves (and, for a genuinely new supplier+product pair, assigns) the
// id/status/refNumber for the record currently being edited in "+ New
// Evaluation" \u2014 shared by both autosave and Submit so they never disagree.
async function resolveDraftIdentity(form){
  if(currentDraftId){
    return { id: currentDraftId, status: currentDraftStatus, refNumber: currentDraftRefNumber };
  }
  const existing = (await listEvaluations()).find(e =>
    e.supplier.trim().toLowerCase()===form.supplier.trim().toLowerCase() &&
    (e.product||"").trim().toLowerCase()===(form.product||"").trim().toLowerCase()
  );
  if(existing){
    currentDraftId = existing.id;
    currentDraftStatus = existing.status;
    currentDraftRefNumber = existing.refNumber || null;
  }else{
    currentDraftId = Date.now()+"-"+Math.random().toString(36).slice(2,8);
    currentDraftStatus = null;
    currentDraftRefNumber = await getNextRefNumber();
  }
  return { id: currentDraftId, status: currentDraftStatus, refNumber: currentDraftRefNumber };
}

async function render(){
  const main = document.getElementById("main");
  if(currentView==="new"){ main.innerHTML = renderNew(editingRecord); wireNewView(editingRecord); }
  else if(currentView==="ongoing"){ main.innerHTML = await renderOngoing(); wireOngoingView(); }
  else if(currentView==="history"){ main.innerHTML = await renderHistory(); wireHistoryView(); }
  else if(currentView==="byproduct"){ main.innerHTML = await renderByProduct(); wireByProductView(); }
}

function relativeTime(ts){
  if(!ts) return "\u2014";
  const diffMs = Date.now()-ts;
  const mins = Math.round(diffMs/60000);
  if(mins<1) return "just now";
  if(mins<60) return mins+" min ago";
  const hrs = Math.round(mins/60);
  if(hrs<24) return hrs+" hr ago";
  const days = Math.round(hrs/24);
  return days+" day"+(days===1?"":"s")+" ago";
}

function debounce(fn, wait){
  return (...args)=>{ clearTimeout(autoSaveTimer); autoSaveTimer=setTimeout(()=>fn(...args), wait); };
}

async function autoSaveDraft(){
  const form = collectForm();
  if(!form.supplier){ return; } // nothing to key the record on yet
  const computed = computeScores(form);
  const identity = await resolveDraftIdentity(form);
  const record = { id: identity.id, refNumber: identity.refNumber, supplier: form.supplier, product: form.product,
                    notes: form.notes, proc: form.proc, qc: form.qc, answers: readableAnswers(form), computed,
                    status: identity.status||"draft", updatedAt: Date.now() };
  const indicator = document.getElementById("autosave-status");
  try{
    await saveEvaluation(record);
    if(indicator) indicator.textContent = formatRefNumber(identity.refNumber)+" \u00b7 Draft saved \u00b7 " + new Date().toLocaleTimeString();
  }catch(e){
    if(indicator) indicator.textContent = "Autosave failed \u2014 see toast";
  }
}
const debouncedAutoSave = debounce(autoSaveDraft, 700);

function wireNewView(editing){
  currentDraftId = (editing && editing.id) ? editing.id : null;
  currentDraftStatus = (editing && editing.status) ? editing.status : null;
  currentDraftRefNumber = (editing && editing.refNumber) ? editing.refNumber : null;
  if(editing){ fillFormFields(editing); }

  document.querySelectorAll("#main input, #main select, #main textarea").forEach(el=>{
    el.addEventListener("input", debouncedAutoSave);
    el.addEventListener("change", debouncedAutoSave);
  });

  document.getElementById("btn-preview").addEventListener("click", ()=>{
    const form = collectForm();
    const computed = computeScores(form);
    document.getElementById("preview-box").innerHTML = renderPreview(form, computed);
  });

  document.getElementById("btn-save").addEventListener("click", async (ev)=>{
    const btn = ev.currentTarget;
    clearTimeout(autoSaveTimer); // don't let a pending debounced draft-save race the submit
    const form = collectForm();
    if(!form.supplier){ showToast("Enter a supplier name before submitting."); return; }
    const computed = computeScores(form);
    const identity = await resolveDraftIdentity(form);
    currentDraftStatus = "submitted";
    const record = { id: identity.id, refNumber: identity.refNumber, supplier: form.supplier, product: form.product,
                      notes: form.notes, proc: form.proc, qc: form.qc, answers: readableAnswers(form), computed,
                      status: "submitted", updatedAt: Date.now() };
    btn.disabled = true; btn.textContent = "Submitting\u2026";
    try{
      await saveEvaluation(record);
      const productKey = (form.product||"").trim().toLowerCase();
      const submittedForProduct = productKey
        ? (await listEvaluations()).filter(e => e.status==="submitted" && (e.product||"").trim().toLowerCase()===productKey)
        : [];
      let msg = `${formatRefNumber(identity.refNumber)} submitted` + (storageMode==="memory" ? " (this session only \u2014 export to keep it)." : ".");
      if(submittedForProduct.length>=2){
        msg += ` Comparison for "${form.product.trim()}" is ready \u2014 ${submittedForProduct.length} suppliers submitted. See By Product.`;
      }
      showToast(msg);
      editingRecord = null;
      currentView="byproduct"; setActiveNav(); render();
    }catch(e){
      editingRecord = null;
      currentView="byproduct"; setActiveNav(); render();
    }finally{
      btn.disabled = false; btn.textContent = "Submit Evaluation";
    }
  });
}

function wireByProductView(){
  document.querySelectorAll("[data-del]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      await deleteEvaluation(btn.getAttribute("data-del"));
      showToast("Evaluation deleted.");
      render();
    });
  });
  wireDetailAndExportButtons(id => lastByProductList.find(e=>e.id===id));
  wireEditButtons(id => lastByProductList.find(e=>e.id===id));
  document.querySelectorAll("[data-compare]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = btn.getAttribute("data-compare");
      const count = btn.getAttribute("data-count");
      const box = document.querySelector(`[data-compare-container="${CSS.escape(idx)}"]`);
      if(!box) return;
      const show = box.style.display==="none" || !box.style.display;
      box.style.display = show ? "block" : "none";
      btn.textContent = show ? "Hide Comparison" : `Compare (${count} suppliers)`;
    });
  });
  document.querySelectorAll("[data-save-compare]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const idx = btn.getAttribute("data-save-compare");
      const grp = compareGroupsByIdx[idx];
      if(!grp){ showToast("Couldn't find that comparison \u2014 try refreshing."); return; }
      const record = await saveComparisonRecord(grp.label, grp.submitted);
      exportComparisonRecord(record);
      showToast("Comparison result saved \u2014 logged in History and downloaded.");
    });
  });
  document.querySelectorAll("[data-add-supplier]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = btn.getAttribute("data-add-supplier");
      const label = groupLabelsByIdx[idx];
      startNewForProduct(label && label!=="(No product specified)" ? label : "");
    });
  });
  const exportBtn = document.getElementById("btn-export");
  if(exportBtn) exportBtn.addEventListener("click", async ()=>{
    const evals = await listEvaluations();
    if(!evals.length){ showToast("Nothing to export yet."); return; }
    exportAll(evals);
    showToast("Exported "+evals.length+" evaluation"+(evals.length===1?"":"s")+".");
  });
  const importInput = document.getElementById("file-import");
  if(importInput) importInput.addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    await importAll(file);
    render();
  });
}

function setActiveNav(){
  document.querySelectorAll("nav.side button").forEach(b=>{
    b.classList.toggle("active", b.getAttribute("data-view")===currentView);
  });
}

document.querySelectorAll("nav.side button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    currentView = btn.getAttribute("data-view");
    if(currentView==="new") editingRecord=null; // fresh blank form unless opened via Resume
    setActiveNav();
    render();
  });
});

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  const duration = Math.min(7000, Math.max(2400, msg.length*45));
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(()=>t.classList.remove("show"), duration);
}

(async function init(){
  await probeStorage();
  if(storageMode==="memory"){
    showToast("Running without Google Sheet sync this session \u2014 see the note in History.");
  }
  render();
})();
</script>
</body>
